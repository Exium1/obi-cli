[package]
name = "obi-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "obi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
clap-verbosity-flag = "2"
env_logger = "0.11"
log = "0.4"
thiserror = "2"
similar = "3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.25.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
derive-new = "0.7.0"
toml = "1.2.2"
serde_yaml_ng = "0.10.0"
